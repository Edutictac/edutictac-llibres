# Preparation phase: loopback only, read-only Rebost, publication disabled.
name: edutictac-llibres-production
services:
  llibres:
    image: ${LLIBRES_IMAGE:-edutictac/llibres:production-candidate}
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8182/health"]
      interval: 15s
      timeout: 3s
      retries: 3
