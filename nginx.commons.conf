pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /health { return 200 'ok'; add_header Content-Type text/plain; }
    location /engine/ { alias /opt/exelearning/; index index.html; }
    location = /favicon.ico { return 204; }
# Included within the existing server. Fixed local upstream; never client-supplied.
resolver 127.0.0.11 valid=30s ipv6=off;
set $rebost_portal http://portal:80;
proxy_connect_timeout 3s;
proxy_read_timeout 20s;
location = /rebost-status {
    default_type application/json;
    return 200 '{"enabled":true}';
}
location /assets/ {
    limit_except GET { deny all; }
    proxy_pass $rebost_portal;
    proxy_set_header Accept-Encoding "";
    sub_filter 'src="/i18n.js"' 'src="/rebost-i18n.js"';
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
}
location = /rebost-i18n.js {
    limit_except GET { deny all; }
    proxy_pass $rebost_portal/i18n.js;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
}
location /api/assets/v1/ {
    limit_except GET { deny all; }
    proxy_pass $rebost_portal;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    proxy_redirect off;
    proxy_buffering off;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
# Authentication happens in Commons, in its own tab, with its existing session.
location = /student.html { return 302 http://$host:${COMMONS_PORTAL_PORT}/student.html$is_args$args; }
location = /api/auth/oidc/login { return 302 http://$host:${COMMONS_PORTAL_PORT}/api/auth/oidc/login$is_args$args; }

    location = /publication-status {
        proxy_pass $rebost_portal/api/modules/status;
        proxy_set_header Host $http_host;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }
    location /api/llibres/ {
        client_max_body_size 30m;
        proxy_pass $rebost_portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header X-Llibres-Publisher "";
        proxy_set_header X-Llibres-Group "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ =404; }
}

}
