server {
    listen 127.0.0.1:8182;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-cache always;
    add_header Content-Security-Policy "default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    location = /health { return 200 'ok'; add_header Content-Type text/plain; }
    location /engine/ { alias /opt/exelearning/; index index.html; }
    location = /favicon.ico { return 204; }
    # The Commons portal is already published on the same host loopback.
    location = /rebost-status {
        default_type application/json;
        return 200 '{"enabled":true}';
    }
    location = /publication-status {
        default_type application/json;
        return 200 '{"enabled":false}';
    }
    location /api/llibres/ {
        client_max_body_size 30m;
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header X-Llibres-Publisher "";
        proxy_set_header X-Llibres-Group "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
        proxy_read_timeout 120s;
        add_header Cache-Control "private, no-store" always;
    }
    location /assets/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Accept-Encoding "";
        sub_filter 'src="/i18n.js"' 'src="/rebost-i18n.js"';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
    }
    location = /rebost-i18n.js {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8180/i18n.js;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
    }
    location /api/assets/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_redirect off;
        proxy_buffering off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /student.html {
        return 302 https://commons.edutictac.es/student.html$is_args$args;
    }
    location = /api/auth/oidc/login {
        return 302 https://commons.edutictac.es/api/auth/oidc/login$is_args$args;
    }
    location / { try_files $uri $uri/ =404; }
}
