name: edutictac-llibres-preview
services:
  llibres:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${LLIBRES_BIND:-0.0.0.0}:${LLIBRES_PORT:-8098}:8080"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./vendor/exelearning/static:/opt/exelearning:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
