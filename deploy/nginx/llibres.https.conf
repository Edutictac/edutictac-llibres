# Dedicated certificate; never replace the shared edutictac.es certificate.
server {
    listen 80;
    listen [::]:80;
    server_name llibres.edutictac.es;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/commons-acme;
        default_type text/plain;
    }
    location / { return 301 https://llibres.edutictac.es$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llibres.edutictac.es;
    ssl_certificate /etc/letsencrypt/live/llibres.edutictac.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llibres.edutictac.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # Publication is enabled only on the verified HTTPS origin. The loopback
    # preparation profile remains disabled and all API permissions stay in Commons.
    location = /publication-status {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 200 '{"enabled":true}';
    }
    location = /source/llibres-source.zip {
        alias /var/www/llibres-source/llibres-source.zip;
        default_type application/zip;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8182;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
