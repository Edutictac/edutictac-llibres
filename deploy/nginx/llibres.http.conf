# Bootstrap ACME only. Replace with llibres.https.conf after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name llibres.edutictac.es;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/commons-acme;
        default_type text/plain;
    }
    location / { return 404; }
}
